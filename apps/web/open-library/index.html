<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Library — MyPipCam</title>
    <meta
      name="description"
      content="Bridge from the MyPipCam Mac app into the Chrome extension Library."
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#111312" />
    <link rel="canonical" href="https://mypipcam.earnyour.com/open-library" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/open-library/open-library.css" />
  </head>
  <body>
    <header class="ol-header">
      <a class="brand" href="/">MyPipCam</a>
    </header>

    <main class="ol-main">
      <h1 id="title">Opening Library…</h1>
      <p class="body" id="body">
        Asking the MyPipCam Chrome extension to open your recording library.
      </p>
      <div class="actions" id="actions" hidden>
        <a class="btn primary" id="openDirect" href="#">Open extension page</a>
        <a class="btn ghost" href="chrome://extensions" id="openExts">chrome://extensions</a>
      </div>
      <p class="hint" id="hint" hidden></p>
    </main>

    <footer class="ol-footer">
      <a href="/">Home</a>
      ·
      <a href="/privacy">Privacy</a>
    </footer>

    <script src="/open-library/open-library.js" defer></script>
  </body>
</html>
