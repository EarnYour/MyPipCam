<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch — MyPipCam</title>
    <meta name="description" content="Watch a MyPipCam shared recording." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#111312" />
    <link rel="canonical" href="https://mypipcam.earnyour.com/w/" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyPipCam" />
    <meta property="og:title" content="Watch — MyPipCam" />
    <meta
      property="og:description"
      content="Watch a shared MyPipCam recording with camera PiP."
    />
    <meta property="og:url" content="https://mypipcam.earnyour.com/w/" />
    <meta property="og:image" content="https://mypipcam.earnyour.com/assets/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Watch — MyPipCam" />
    <meta
      name="twitter:description"
      content="Watch a shared MyPipCam recording with camera PiP."
    />
    <meta name="twitter:image" content="https://mypipcam.earnyour.com/assets/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/w/watch.css" />
  </head>
  <body>
    <header class="watch-header">
      <a class="brand" href="/">MyPipCam</a>
      <span class="muted" id="status">Loading…</span>
    </header>

    <main class="watch-main">
      <h1 class="visually-hidden">Watch shared recording</h1>
      <div class="stage" id="stage">
        <div class="placeholder" id="placeholder">
          <p class="placeholder-title" id="placeholderTitle">Opening recording…</p>
          <p class="placeholder-body" id="placeholderBody">
            One moment while we load the shared video.
          </p>
        </div>
        <iframe
          id="player"
          class="player"
          title="Shared recording"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
          hidden
        ></iframe>
        <div class="processing-banner" id="processingBanner" hidden>
          <p class="processing-title" id="processingTitle">Still processing on Google Drive</p>
          <p class="processing-body" id="processingBody">
            Google does not publish a progress percent. This page checks again automatically.
          </p>
        </div>
      </div>
      <p class="hint" id="hint" hidden></p>
    </main>

    <footer class="watch-footer">
      <a href="/">Record with MyPipCam</a>
      ·
      <a href="/privacy">Privacy</a>
    </footer>

    <script src="/w/watch.js" defer></script>
  </body>
</html>
