<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPipCam — Allow microphone</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111312;
        --fg: #fafaf7;
        --muted: #a8a8a0;
        --primary: #ff5e29;
        --ok: #3dcea0;
        --danger: #ff6b5a;
        --border: rgba(255, 255, 255, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 600 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 16px 16px 14px;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: 0.01em;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .status {
        margin: 2px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        font-size: 13px;
        font-weight: 650;
      }
      .status.is-ok {
        border-color: rgba(61, 206, 160, 0.45);
        background: rgba(61, 206, 160, 0.12);
        color: #d8fff0;
      }
      .status.is-bad {
        border-color: rgba(255, 107, 90, 0.45);
        background: rgba(80, 20, 16, 0.75);
        color: #ffe8e4;
      }
      .help {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.45;
      }
      .help code {
        font-size: 10.5px;
        color: #e8e8e0;
      }
      .devices {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        max-height: 72px;
        overflow: auto;
      }
      .devices li {
        padding: 2px 0;
      }
      .devices:empty {
        display: none;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: auto;
      }
      button {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        font: 650 12px/1 ui-sans-serif, system-ui, sans-serif;
        padding: 12px 8px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      button.primary {
        background: rgba(255, 94, 41, 0.28);
        border-color: rgba(255, 94, 41, 0.55);
        color: #ffe8e0;
        font-weight: 750;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Allow microphone</h1>
    <p class="sub">
      Click the button below — Chrome’s Allow dialog appears in <em>this</em> window (not the
      extension popup).
    </p>
    <p class="status" id="status" role="status">Ready — click Allow microphone</p>
    <ul class="devices" id="devices"></ul>
    <p class="help" id="help" hidden></p>
    <div class="row">
      <button type="button" id="allow" class="primary">Allow microphone</button>
      <button type="button" id="close">Close</button>
    </div>
    <script type="module" src="./mic.ts"></script>
  </body>
</html>
