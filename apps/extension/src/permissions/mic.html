<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPipCam — Allow microphone</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111312;
        --fg: #fafaf7;
        --muted: #a8a8a0;
        --primary: #ff5e29;
        --border: rgba(255, 255, 255, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 600 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 750;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .status {
        margin: 4px 0 0;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        font-size: 14px;
        font-weight: 650;
      }
      .status.is-ok {
        border-color: rgba(61, 206, 160, 0.45);
        background: rgba(61, 206, 160, 0.12);
        color: #d8fff0;
      }
      .status.is-bad {
        border-color: rgba(255, 107, 90, 0.45);
        background: rgba(80, 20, 16, 0.75);
        color: #ffe8e4;
      }
      .help {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.45;
      }
      .devices {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .devices li {
        padding: 2px 0;
      }
      .devices:empty {
        display: none;
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
      }
      button {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        font: 700 15px/1 ui-sans-serif, system-ui, sans-serif;
        padding: 14px 12px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      button.primary {
        background: rgba(255, 94, 41, 0.35);
        border-color: rgba(255, 94, 41, 0.65);
        color: #fff4ee;
        font-size: 16px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.ghost {
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Allow microphone for MyPipCam</h1>
    <p class="sub">
      Click the orange button. Chrome should show an <strong>Allow</strong> prompt near the top of
      this window (address bar / permission bubble). Choose <strong>Allow</strong>.
    </p>
    <p class="status" id="status" role="status">Ready — click Allow microphone</p>
    <ul class="devices" id="devices"></ul>
    <p class="help" id="help" hidden></p>
    <div class="row">
      <button type="button" id="allow" class="primary" autofocus>Allow microphone</button>
      <button type="button" id="close" class="ghost">Close</button>
    </div>
    <script type="module" src="./mic.ts"></script>
  </body>
</html>
