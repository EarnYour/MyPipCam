<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPipCam Camera</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c1016;
      }
      video,
      canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #111;
      }
      video.mirror,
      canvas.mirror {
        transform: scaleX(-1);
      }
      .is-hidden {
        display: none !important;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font: 600 12px/1.3 system-ui, sans-serif;
        text-align: center;
        padding: 12px;
        background: #1a222d;
      }
    </style>
  </head>
  <body>
    <video id="cam" muted playsinline autoplay></video>
    <canvas id="out" class="is-hidden" aria-hidden="true"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
