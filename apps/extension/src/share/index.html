<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPipCam — Choose tab to share</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #2b2b2b;
        --ink: #fafaf7;
        --muted: rgba(250, 250, 247, 0.55);
        --primary: #ff5e29;
        --callout: #c44a1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 500 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .brand {
        position: absolute;
        top: 20px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 2;
      }
      .brand img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: block;
      }
      .brand span {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 24px 96px;
        gap: 20px;
        text-align: center;
      }
      .callout {
        position: relative;
        max-width: 340px;
        margin-top: 8px;
        padding: 14px 18px;
        border-radius: 12px;
        background: var(--callout);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .callout::before {
        content: '';
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-bottom: 9px solid var(--callout);
      }
      .status {
        max-width: 360px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .status.is-bad {
        color: #ffb4a8;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(280px, 100%);
      }
      button {
        border: none;
        border-radius: 14px;
        padding: 14px 16px;
        font: 700 15px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      button.primary {
        background: var(--primary);
        color: #fff;
      }
      button.primary:hover:not(:disabled) {
        filter: brightness(1.05);
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        font-weight: 600;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 28px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .tab-hint {
        margin: 0;
        max-width: 360px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="/icons/icon48.png" width="32" height="32" alt="" />
      <span>MyPipCam</span>
    </div>
    <main class="stage">
      <p class="tab-hint" id="tabHint">Recording your Chrome tab</p>
      <div class="callout" id="callout">Tap “Share” to return to your original tab</div>
      <p class="status" id="status" role="status">Chrome will ask which tab to share…</p>
      <div class="actions">
        <button type="button" class="primary" id="shareBtn">Choose Chrome Tab</button>
        <button type="button" class="ghost" id="cancelBtn">Cancel</button>
      </div>
    </main>
    <p class="footer">This step is required for Chrome extensions.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
