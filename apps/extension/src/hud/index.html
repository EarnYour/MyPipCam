<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REC</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1c1b;
        --fg: #fafaf7;
        --muted: #8a8d88;
        --primary: #ff5e29;
        --stop: #e11d2e;
        --border: rgba(255, 255, 255, 0.1);
        --btn: rgba(255, 255, 255, 0.07);
        --btn-hover: rgba(255, 255, 255, 0.14);
        --dock-pad: 8px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--fg);
        font: 600 11px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 6px 6px 8px;
      }
      .dock {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: var(--dock-pad) 6px 10px;
        border-radius: 22px;
        background: linear-gradient(180deg, #222524 0%, #141615 100%);
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        min-width: 0;
      }
      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--stop);
        margin-top: 2px;
        flex-shrink: 0;
        box-shadow: 0 0 0 3px rgba(225, 29, 46, 0.22);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .rec-dot.is-paused {
        background: var(--muted);
        box-shadow: none;
        animation: none;
      }
      .rec-dot.is-countdown {
        background: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 94, 41, 0.22);
        animation: none;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      .timer {
        text-align: center;
        font: 700 12px/1.1 ui-sans-serif, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
        letter-spacing: 0.02em;
        padding: 2px 0 4px;
        min-height: 1.1em;
      }
      .timer.is-hidden {
        display: none;
      }
      .count {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 2px solid var(--primary);
        background: rgba(255, 94, 41, 0.1);
        font: 800 20px/1 ui-sans-serif, system-ui, sans-serif;
        color: var(--primary);
        margin: 2px 0 4px;
        flex-shrink: 0;
      }
      .count.is-hidden {
        display: none;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
        margin-top: 2px;
      }
      .stack.is-hidden {
        display: none;
      }
      .divider {
        width: 22px;
        height: 1px;
        background: var(--border);
        margin: 2px 0;
        flex-shrink: 0;
      }
      .divider.is-hidden {
        display: none;
      }
      button.icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--btn);
        color: var(--fg);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
        transition: background 0.12s ease, transform 0.1s ease;
      }
      button.icon:hover:not(:disabled) {
        background: var(--btn-hover);
      }
      button.icon:active:not(:disabled) {
        transform: scale(0.96);
      }
      button.icon:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.icon svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      button.icon.stop {
        background: var(--stop);
        border-color: transparent;
        color: #fff;
      }
      button.icon.stop:hover:not(:disabled) {
        background: #c91828;
      }
      button.icon.stop svg {
        width: 14px;
        height: 14px;
      }
      button.icon.primary {
        background: rgba(255, 94, 41, 0.2);
        border-color: rgba(255, 94, 41, 0.45);
        color: #ffe8e0;
      }
      button.icon.primary:hover:not(:disabled) {
        background: rgba(255, 94, 41, 0.32);
      }
      button.icon.danger-ghost {
        color: #ffb4a8;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .err {
        width: 100%;
        color: #ffe8e4;
        background: rgba(80, 20, 16, 0.9);
        border: 1px solid rgba(255, 120, 100, 0.4);
        border-radius: 10px;
        padding: 4px 3px;
        font-size: 9px;
        font-weight: 650;
        line-height: 1.2;
        text-align: center;
        word-break: break-word;
      }
      .err:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="dock" role="toolbar" aria-label="Recording controls">
      <div class="rec-dot is-countdown" id="recDot" aria-hidden="true"></div>
      <p class="sr-only" id="status">Starting…</p>
      <div class="count" id="count" aria-live="polite">3</div>
      <div class="timer is-hidden" id="timer" aria-live="polite">0:00</div>
      <div class="err" id="err"></div>

      <div class="stack" id="countdownActions">
        <button type="button" class="icon" id="cancelCountdown" title="Cancel" aria-label="Cancel countdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <button type="button" class="icon primary" id="skipCountdown" title="Skip countdown" aria-label="Skip countdown">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 5v14l9-7-9-7zm10 0v14h3V5h-3z" />
          </svg>
        </button>
      </div>

      <div class="stack is-hidden" id="recActions">
        <button type="button" class="icon stop" id="stop" title="Stop &amp; save" aria-label="Stop and save">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
        <button type="button" class="icon" id="pause" title="Pause" aria-label="Pause">
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="5" width="4" height="14" rx="1" />
            <rect x="14" y="5" width="4" height="14" rx="1" />
          </svg>
        </button>
        <div class="divider" id="moreDivider" aria-hidden="true"></div>
        <button type="button" class="icon" id="trim" title="Rewind 20s &amp; continue" aria-label="Rewind 20 seconds and continue recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14l-5-5 5-5" />
            <path d="M4 9h10a5 5 0 010 10H9" />
          </svg>
        </button>
        <button type="button" class="icon" id="restart" title="Restart" aria-label="Restart recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 4v6h6" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
        </button>
        <button type="button" class="icon danger-ghost" id="discard" title="Discard" aria-label="Discard recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16" />
            <path d="M9 7V5h6v2" />
            <path d="M7 7l1 12h8l1-12" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
