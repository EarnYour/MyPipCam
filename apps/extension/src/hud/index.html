<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPipCam Recording</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111312;
        --fg: #fafaf7;
        --muted: #a8a8a0;
        --primary: #ff5e29;
        --danger: #ff6b5a;
        --border: rgba(255, 255, 255, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 600 13px/1.35 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 14px 14px 12px;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.01em;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .count {
        margin: 4px auto 0;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 3px solid var(--primary);
        background: rgba(255, 255, 255, 0.04);
        font: 800 36px/1 ui-sans-serif, system-ui, sans-serif;
      }
      .count.is-hidden {
        display: none;
      }
      .timer {
        text-align: center;
        font: 750 22px/1 ui-sans-serif, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--primary);
      }
      .timer.is-hidden {
        display: none;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: auto;
      }
      button {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        font: 650 12px/1 ui-sans-serif, system-ui, sans-serif;
        padding: 10px 8px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      button.danger {
        background: rgba(255, 94, 41, 0.18);
        border-color: rgba(255, 94, 41, 0.45);
        color: #ffe8e0;
      }
      .err {
        color: #ffe8e4;
        background: rgba(80, 20, 16, 0.85);
        border: 1px solid rgba(255, 120, 100, 0.4);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
      }
      .err:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>MyPipCam</h1>
    <p class="sub" id="status">Starting…</p>
    <div class="count" id="count" aria-live="polite">3</div>
    <div class="timer is-hidden" id="timer">0:00</div>
    <div class="err" id="err"></div>
    <div class="row">
      <button type="button" id="discard">Discard</button>
      <button type="button" class="danger" id="stop">Stop &amp; save</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
