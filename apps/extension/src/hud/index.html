<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REC</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1c1b;
        --fg: #fafaf7;
        --muted: #8a8d88;
        --primary: #ff5e29;
        --stop: #e11d2e;
        --border: rgba(255, 255, 255, 0.1);
        --btn: rgba(255, 255, 255, 0.07);
        --btn-hover: rgba(255, 255, 255, 0.14);
        --dock-pad: 8px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--fg);
        font: 600 11px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 6px 6px 8px;
      }
      .dock {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: var(--dock-pad) 6px 10px;
        border-radius: 22px;
        background: linear-gradient(180deg, #222524 0%, #141615 100%);
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        min-width: 0;
      }
      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--stop);
        margin-top: 2px;
        flex-shrink: 0;
        box-shadow: 0 0 0 3px rgba(225, 29, 46, 0.22);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .rec-dot.is-paused {
        background: var(--muted);
        box-shadow: none;
        animation: none;
      }
      .rec-dot.is-countdown {
        background: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 94, 41, 0.22);
        animation: none;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      .timer {
        text-align: center;
        font: 700 12px/1.1 ui-sans-serif, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
        letter-spacing: 0.02em;
        padding: 2px 0 4px;
        min-height: 1.1em;
      }
      .timer.is-hidden {
        display: none;
      }
      .count {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 2px solid var(--primary);
        background: rgba(255, 94, 41, 0.1);
        font: 800 20px/1 ui-sans-serif, system-ui, sans-serif;
        color: var(--primary);
        margin: 2px 0 4px;
        flex-shrink: 0;
      }
      .count.is-hidden {
        display: none;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
        margin-top: 2px;
      }
      .stack.is-hidden {
        display: none;
      }
      .divider {
        width: 22px;
        height: 1px;
        background: var(--border);
        margin: 2px 0;
        flex-shrink: 0;
      }
      .divider.is-hidden {
        display: none;
      }
      button.icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--btn);
        color: var(--fg);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
        transition: background 0.12s ease, transform 0.1s ease;
      }
      button.icon:hover:not(:disabled) {
        background: var(--btn-hover);
      }
      button.icon:active:not(:disabled) {
        transform: scale(0.96);
      }
      button.icon:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.icon svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      button.icon.stop {
        background: var(--stop);
        border-color: transparent;
        color: #fff;
      }
      button.icon.stop:hover:not(:disabled) {
        background: #c91828;
      }
      button.icon.stop svg {
        width: 14px;
        height: 14px;
      }
      button.icon.primary {
        background: rgba(255, 94, 41, 0.2);
        border-color: rgba(255, 94, 41, 0.45);
        color: #ffe8e0;
      }
      button.icon.primary:hover:not(:disabled) {
        background: rgba(255, 94, 41, 0.32);
      }
      button.icon.danger-ghost {
        color: #ffb4a8;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .err {
        width: 100%;
        color: #ffe8e4;
        background: rgba(80, 20, 16, 0.9);
        border: 1px solid rgba(255, 120, 100, 0.4);
        border-radius: 10px;
        padding: 4px 3px;
        font-size: 9px;
        font-weight: 650;
        line-height: 1.2;
        text-align: center;
        word-break: break-word;
      }
      .err:empty {
        display: none;
      }

      /* Expanded rewind & trim scrub panel (HUD window is resized by main.ts) */
      body.is-rewind {
        padding: 10px;
        justify-content: stretch;
        align-items: stretch;
      }
      body.is-rewind .dock {
        display: none;
      }
      .rewind {
        display: none;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        padding: 12px 14px 14px;
        border-radius: 16px;
        background: linear-gradient(165deg, #222524 0%, #141615 100%);
        border: 1px solid var(--border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      body.is-rewind .rewind {
        display: flex;
      }
      .rewind-title {
        font: 750 14px/1.2 ui-sans-serif, system-ui, sans-serif;
      }
      .rewind-time {
        font: 750 26px/1.1 ui-sans-serif, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
      }
      .rewind-time span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        margin-left: 6px;
      }
      .rewind-preview {
        display: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 160px;
        border-radius: 10px;
        overflow: hidden;
        background: #0b0c0b;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .rewind-preview.is-visible {
        display: block;
      }
      .rewind-preview video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .rewind-scrub-label {
        font-size: 11px;
        font-weight: 650;
        color: var(--muted);
      }
      .rewind input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 28px;
        margin: 0;
        background: transparent;
        cursor: pointer;
        accent-color: var(--primary);
      }
      .rewind input[type='range']::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          var(--primary) 0%,
          var(--primary) var(--rewind-pct, 100%),
          rgba(255, 255, 255, 0.16) var(--rewind-pct, 100%),
          rgba(255, 255, 255, 0.16) 100%
        );
      }
      .rewind input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin-top: -6px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--primary);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      .rewind-ends {
        display: flex;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .rewind-jumps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .rewind-jumps span {
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .rewind-jumps button {
        border: none;
        cursor: pointer;
        padding: 7px 11px;
        border-radius: 8px;
        background: var(--btn);
        color: var(--fg);
        font: 650 12px/1.2 ui-sans-serif, system-ui, sans-serif;
      }
      .rewind-jumps button:hover:not(:disabled) {
        background: var(--btn-hover);
      }
      .rewind-actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
      }
      .rewind-actions button {
        border: none;
        cursor: pointer;
        padding: 11px 12px;
        border-radius: 10px;
        font: 700 13px/1.2 ui-sans-serif, system-ui, sans-serif;
        color: var(--fg);
        background: var(--btn);
      }
      .rewind-actions button:hover:not(:disabled) {
        background: var(--btn-hover);
      }
      .rewind-actions button.apply {
        flex: 1;
        background: var(--primary);
        color: #fff;
      }
      .rewind-actions button.apply:hover:not(:disabled) {
        background: #e85220;
      }
      .rewind-actions button:disabled,
      .rewind-jumps button:disabled,
      .rewind input[type='range']:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .rewind-hint {
        font-size: 11px;
        font-weight: 550;
        color: var(--muted);
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="dock" role="toolbar" aria-label="Recording controls">
      <div class="rec-dot is-countdown" id="recDot" aria-hidden="true"></div>
      <p class="sr-only" id="status">Starting…</p>
      <div class="count" id="count" aria-live="polite">3</div>
      <div class="timer is-hidden" id="timer" aria-live="polite">0:00</div>
      <div class="err" id="err"></div>

      <div class="stack" id="countdownActions">
        <button type="button" class="icon" id="cancelCountdown" title="Cancel" aria-label="Cancel countdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <button type="button" class="icon primary" id="skipCountdown" title="Skip countdown" aria-label="Skip countdown">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 5v14l9-7-9-7zm10 0v14h3V5h-3z" />
          </svg>
        </button>
      </div>

      <div class="stack is-hidden" id="recActions">
        <button type="button" class="icon stop" id="stop" title="Stop &amp; save" aria-label="Stop and save">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
        <button type="button" class="icon" id="pause" title="Pause" aria-label="Pause">
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="5" width="4" height="14" rx="1" />
            <rect x="14" y="5" width="4" height="14" rx="1" />
          </svg>
        </button>
        <div class="divider" id="moreDivider" aria-hidden="true"></div>
        <button type="button" class="icon" id="trim" title="Rewind &amp; trim" aria-label="Rewind and trim — scrub, discard the tail, continue recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14l-5-5 5-5" />
            <path d="M4 9h10a5 5 0 010 10H9" />
          </svg>
        </button>
        <button type="button" class="icon" id="restart" title="Restart" aria-label="Restart recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 4v6h6" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
        </button>
        <button type="button" class="icon danger-ghost" id="discard" title="Discard" aria-label="Discard recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16" />
            <path d="M9 7V5h6v2" />
            <path d="M7 7l1 12h8l1-12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="rewind" id="rewind" role="dialog" aria-modal="true" aria-label="Rewind and trim">
      <div class="rewind-title">Rewind &amp; trim</div>
      <div class="rewind-time" id="rewindTime" aria-live="polite">0:00</div>
      <div class="rewind-preview" id="rewindPreview">
        <video id="rewindVideo" muted playsinline preload="auto" aria-label="Preview frame at scrub position"></video>
      </div>
      <div class="rewind-scrub-label">Drag to the exact moment</div>
      <input type="range" id="rewindRange" min="0" max="1000" value="1000" step="1" aria-label="Trim point" />
      <div class="rewind-ends">
        <span>0:00</span>
        <span id="rewindTotal">0:00</span>
      </div>
      <div class="rewind-jumps">
        <span>Jump</span>
        <button type="button" data-jump="5000">−5s</button>
        <button type="button" data-jump="10000">−10s</button>
        <button type="button" data-jump="20000">−20s</button>
      </div>
      <p class="rewind-hint">Keeps up to the scrub point, discards the rest, resumes the same take.</p>
      <div class="rewind-actions">
        <button type="button" id="rewindCancel">Cancel</button>
        <button type="button" class="apply" id="rewindApply">Trim &amp; continue</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
